<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="800" fill="#ffffff"/>

  <text x="380" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Rozmieszczenie profili stelaza — sufit GK (493 x 478 cm)</text>
  <text x="380" y="50" font-size="12.5" text-anchor="middle" fill="#666">montazowe CD co 40 cm  •  nosne CD co 90 cm  •  wieszaki co 90 cm  •  UD po obwodzie  •  kieszen LED 10 cm od sciany</text>

  <!-- room offset (60,70), 1px=1cm, room 493x478 -> (60..553, 70..548) -->

  <!-- ===== MONTAZOWE CD (poziome, co 40 cm) — do nich plyta ===== -->
  <g stroke="#9aa0a6" stroke-width="1.4">
    <line x1="60" y1="110" x2="553" y2="110"/>
    <line x1="60" y1="150" x2="553" y2="150"/>
    <line x1="60" y1="190" x2="553" y2="190"/>
    <line x1="60" y1="230" x2="553" y2="230"/>
    <line x1="60" y1="270" x2="553" y2="270"/>
    <line x1="60" y1="310" x2="553" y2="310"/>
    <line x1="60" y1="350" x2="553" y2="350"/>
    <line x1="60" y1="390" x2="553" y2="390"/>
    <line x1="60" y1="430" x2="553" y2="430"/>
    <line x1="60" y1="470" x2="553" y2="470"/>
    <line x1="60" y1="510" x2="553" y2="510"/>
  </g>

  <!-- ===== NOSNE CD (pionowe, co 90 cm) — gorny poziom ===== -->
  <g stroke="#2b3a55" stroke-width="2.4" stroke-dasharray="10 5">
    <line x1="105" y1="70" x2="105" y2="548"/>
    <line x1="195" y1="70" x2="195" y2="548"/>
    <line x1="285" y1="70" x2="285" y2="548"/>
    <line x1="375" y1="70" x2="375" y2="548"/>
    <line x1="465" y1="70" x2="465" y2="548"/>
    <line x1="540" y1="70" x2="540" y2="548"/>
  </g>

  <!-- ===== WIESZAKI (czerwone punkty co 90 cm wzdluz nosnych) ===== -->
  <g fill="#c0392b">
    <!-- y: 110,200,290,380,470,540 ; x: 105,195,285,375,465,540 -->
    <g>
      <circle cx="105" cy="110" r="4"/><circle cx="105" cy="200" r="4"/><circle cx="105" cy="290" r="4"/><circle cx="105" cy="380" r="4"/><circle cx="105" cy="470" r="4"/><circle cx="105" cy="540" r="4"/>
      <circle cx="195" cy="110" r="4"/><circle cx="195" cy="200" r="4"/><circle cx="195" cy="290" r="4"/><circle cx="195" cy="380" r="4"/><circle cx="195" cy="470" r="4"/><circle cx="195" cy="540" r="4"/>
      <circle cx="285" cy="110" r="4"/><circle cx="285" cy="200" r="4"/><circle cx="285" cy="290" r="4"/><circle cx="285" cy="380" r="4"/><circle cx="285" cy="470" r="4"/><circle cx="285" cy="540" r="4"/>
      <circle cx="375" cy="110" r="4"/><circle cx="375" cy="200" r="4"/><circle cx="375" cy="290" r="4"/><circle cx="375" cy="380" r="4"/><circle cx="375" cy="470" r="4"/><circle cx="375" cy="540" r="4"/>
      <circle cx="465" cy="110" r="4"/><circle cx="465" cy="200" r="4"/><circle cx="465" cy="290" r="4"/><circle cx="465" cy="380" r="4"/><circle cx="465" cy="470" r="4"/><circle cx="465" cy="540" r="4"/>
      <circle cx="540" cy="110" r="4"/><circle cx="540" cy="200" r="4"/><circle cx="540" cy="290" r="4"/><circle cx="540" cy="380" r="4"/><circle cx="540" cy="470" r="4"/><circle cx="540" cy="540" r="4"/>
    </g>
  </g>

  <!-- ===== KIESZEN LED (amber band) salon: lewa/gora/prawa ===== -->
  <g fill="#f5a623" fill-opacity="0.35" stroke="#d99100" stroke-width="1">
    <rect x="60" y="70" width="493" height="14"/>            <!-- gora -->
    <rect x="60" y="70" width="14" height="358"/>            <!-- lewa (TV) -->
    <rect x="539" y="70" width="14" height="358"/>           <!-- prawa (kanapa) -->
  </g>
  <!-- profil krawedziowy kieszeni (linia 10 cm od sciany) -->
  <g stroke="#b8860b" stroke-width="2">
    <line x1="74" y1="84" x2="74" y2="428"/>
    <line x1="74" y1="84" x2="539" y2="84"/>
    <line x1="539" y1="84" x2="539" y2="428"/>
  </g>
  <!-- biuro kieszen (cienka) -->
  <rect x="372" y="534" width="169" height="10" fill="#e8770a" fill-opacity="0.4" stroke="#a8550a"/>

  <!-- ===== UD PRZYSCIENNY (obwod) ===== -->
  <rect x="60" y="70" width="493" height="478" fill="none" stroke="#2e7dd1" stroke-width="4"/>
  <!-- podzial dolny -->
  <line x1="324" y1="428" x2="324" y2="548" stroke="#2e7dd1" stroke-width="3"/>
  <line x1="360" y1="428" x2="360" y2="548" stroke="#2e7dd1" stroke-width="3"/>
  <line x1="60" y1="428" x2="553" y2="428" stroke="#2e7dd1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===== OCZKA (miedzy profilami) ===== -->
  <g fill="none" stroke="#111" stroke-width="1.6">
    <!-- salon 4x3 : x 140,251,362,473 ; y 160,270,380 (przesuniete by NIE lezec na nosnych/montazowych) -->
    <circle cx="140" cy="168" r="8"/><circle cx="251" cy="168" r="8"/><circle cx="362" cy="168" r="8"/><circle cx="473" cy="168" r="8"/>
    <circle cx="140" cy="288" r="8"/><circle cx="251" cy="288" r="8"/><circle cx="362" cy="288" r="8"/><circle cx="473" cy="288" r="8"/>
    <circle cx="140" cy="408" r="8"/><circle cx="251" cy="408" r="8"/><circle cx="362" cy="408" r="8"/><circle cx="473" cy="408" r="8"/>
    <!-- biuro 2x2 -->
    <circle cx="410" cy="468" r="8"/><circle cx="503" cy="468" r="8"/>
    <circle cx="410" cy="512" r="8"/><circle cx="503" cy="512" r="8"/>
    <!-- gospodarcze -->
    <circle cx="150" cy="490" r="8"/><circle cx="240" cy="490" r="8"/>
  </g>

  <!-- etykiety stref -->
  <text x="300" y="120" font-size="16" font-weight="bold" fill="#cfcfcf" text-anchor="middle">SALON</text>
  <text x="192" y="520" font-size="11" font-weight="bold" fill="#cfcfcf" text-anchor="middle">GOSP.</text>
  <text x="456" y="525" font-size="11" font-weight="bold" fill="#cfcfcf" text-anchor="middle">BIURO</text>

  <!-- ===== WYMIARY / ROZSTAWY ===== -->
  <g font-size="11" fill="#c0392b">
    <!-- 40 cm montazowe -->
    <g stroke="#c0392b" stroke-width="0.9">
      <line x1="566" y1="110" x2="566" y2="150"/>
      <line x1="562" y1="110" x2="570" y2="110"/><line x1="562" y1="150" x2="570" y2="150"/>
    </g>
    <text x="600" y="134" fill="#c0392b">40 cm (montazowe CD)</text>
    <!-- 90 cm nosne -->
    <g stroke="#2b3a55" stroke-width="0.9">
      <line x1="105" y1="60" x2="195" y2="60"/>
      <line x1="105" y1="56" x2="105" y2="64"/><line x1="195" y1="56" x2="195" y2="64"/>
    </g>
    <text x="150" y="55" fill="#2b3a55" text-anchor="middle">90 cm</text>
  </g>

  <!-- ===== LEGENDA ===== -->
  <g font-size="12.5" fill="#222" transform="translate(60,585)">
    <text x="0" y="0" font-size="14" font-weight="bold">LEGENDA</text>

    <line x1="0" y1="20" x2="34" y2="20" stroke="#2e7dd1" stroke-width="4"/>
    <text x="44" y="24">UD przyscienny (obwod, do scian)</text>

    <line x1="0" y1="44" x2="34" y2="44" stroke="#2b3a55" stroke-width="2.4" stroke-dasharray="10 5"/>
    <text x="44" y="48">Nosne CD — co 90 cm (gorny poziom)</text>

    <line x1="0" y1="68" x2="34" y2="68" stroke="#9aa0a6" stroke-width="1.6"/>
    <text x="44" y="72">Montazowe CD — co 40 cm (pod plyte)</text>

    <circle cx="17" cy="92" r="4" fill="#c0392b"/>
    <text x="44" y="96">Wieszak — co 90 cm na nosnym CD</text>

    <rect x="0" y="108" width="34" height="12" fill="#f5a623" fill-opacity="0.5" stroke="#d99100"/>
    <text x="44" y="118">Kieszen LED + profil krawedziowy (10 cm)</text>

    <circle cx="17" cy="138" r="8" fill="none" stroke="#111" stroke-width="1.6"/>
    <text x="44" y="142">Oczko slim — ZAWSZE miedzy profilami</text>
  </g>

  <!-- ===== UWAGI ===== -->
  <g font-size="12" fill="#1a1a1a" transform="translate(415,585)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#c0392b">ZASADY MONTAZU</text>
    <text x="0" y="22">1. Najpierw UD do scian (poziomnica/laser).</text>
    <text x="0" y="42">2. Nosne CD co 90 + wieszaki co 90 (krata).</text>
    <text x="0" y="62">3. Montazowe CD co 40 — do nich plyta.</text>
    <text x="0" y="82">4. Kieszen: dodatkowy profil 10 cm od sciany</text>
    <text x="14" y="98">+ krotkie CD na blende (fartuch 4–5 cm).</text>
    <text x="0" y="118" fill="#c0392b">5. OCZKO nie moze wypasc na profilu! —</text>
    <text x="14" y="134" fill="#c0392b">rozmiesc je w polu plyty, min 5 cm od CD.</text>
    <text x="0" y="154">6. Pod profil tasmy = profil ALU (radiator).</text>
    <text x="0" y="174" fill="#c0392b">7. Zostaw KLAPKE REWIZYJNA na zasilacze!</text>
  </g>
</svg>
