<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, sans-serif">
  <defs>
    <pattern id="welna" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#fff7e0"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#e0c97a" stroke-width="1.4"/>
    </pattern>
    <pattern id="sciana" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e6e6e6"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#bdbdbd" stroke-width="1"/>
    </pattern>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#c0392b"/></marker>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1a6fb5"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="680" fill="#ffffff"/>
  <text x="450" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PRZEKROJ — kieszen LED przyscienna (wall-wash)</text>
  <text x="450" y="52" font-size="12.5" text-anchor="middle" fill="#888">rysunek pogladowy (nie w skali)  •  sufit 230 cm  •  bez bruzdowania sciany</text>

  <!-- STROP -->
  <rect x="130" y="70" width="730" height="26" fill="#c4c4c4" stroke="#8a8a8a"/>
  <text x="600" y="88" font-size="13" fill="#444" text-anchor="middle">STROP / strop konstrukcyjny</text>

  <!-- WELNA 15 cm -->
  <rect x="200" y="96" width="660" height="120" fill="url(#welna)" stroke="#e0c97a"/>
  <text x="600" y="162" font-size="13" fill="#9a7b1f" text-anchor="middle">welna 15 cm</text>

  <!-- SCIANA -->
  <rect x="150" y="70" width="50" height="540" fill="url(#sciana)" stroke="#9e9e9e"/>
  <text x="175" y="430" font-size="14" fill="#555" font-weight="bold" transform="rotate(-90 175 430)">SCIANA</text>

  <!-- CD profile nad plyta -->
  <rect x="330" y="286" width="40" height="16" fill="#9aa0a6" stroke="#5f6368"/>
  <text x="470" y="280" font-size="11" fill="#555">profil CD (nosny/montazowy)</text>

  <!-- PLYTA GLOWNA SUFITU (odsunieta od sciany) -->
  <rect x="320" y="302" width="540" height="14" fill="#f0e6c8" stroke="#caa84a"/>
  <text x="640" y="296" font-size="12" fill="#7a5c10">plyta GK sufitu (kreona do CD)</text>
  <text x="700" y="334" font-size="11" fill="#999">plyta 12,5 mm</text>

  <!-- LEDGE przyscienny + profil ALU + tasma -->
  <rect x="200" y="302" width="60" height="14" fill="#f0e6c8" stroke="#caa84a"/>
  <rect x="210" y="316" width="34" height="9" fill="#9aa0a6" stroke="#5f6368"/>
  <rect x="214" y="325" width="26" height="5" fill="#ffd23f" stroke="#d6a400"/>
  <text x="300" y="356" font-size="11.5" fill="#444">profil ALU + tasma (radiator!)</text>
  <line x1="298" y1="352" x2="240" y2="332" stroke="#888" stroke-width="0.8"/>

  <!-- BLENDA (fartuch) na krawedzi plyty od strony pokoju -->
  <rect x="320" y="316" width="13" height="56" fill="#f0e6c8" stroke="#caa84a"/>
  <text x="345" y="360" font-size="12" fill="#7a5c10">blenda GK</text>
  <text x="345" y="376" font-size="10.5" fill="#999">(zaslania tasme)</text>

  <!-- SWIATLO na sciane -->
  <g stroke="#f5a623" stroke-width="1.6" opacity="0.85">
    <line x1="222" y1="332" x2="200" y2="370"/>
    <line x1="224" y1="333" x2="200" y2="430"/>
    <line x1="226" y1="334" x2="200" y2="500"/>
    <line x1="228" y1="335" x2="200" y2="560"/>
  </g>
  <rect x="200" y="332" width="6" height="240" fill="#f5a623" opacity="0.18"/>
  <text x="235" y="540" font-size="12" fill="#d99100" transform="rotate(90 235 540)">swiatlo myje sciane (na pelna wysokosc)</text>

  <!-- ====== WYMIARY ====== -->
  <!-- 8-10 cm: plyta od sciany -->
  <g stroke="#c0392b" stroke-width="1.3">
    <line x1="200" y1="262" x2="320" y2="262" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="200" y1="256" x2="200" y2="268"/><line x1="320" y1="256" x2="320" y2="268"/>
  </g>
  <text x="260" y="254" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">8–10 cm</text>
  <text x="260" y="240" font-size="10.5" fill="#c0392b" text-anchor="middle">(plyta od sciany = szczelina)</text>

  <!-- 2-4 cm: tasma od sciany -->
  <g stroke="#1a6fb5" stroke-width="1.2">
    <line x1="200" y1="400" x2="227" y2="400" marker-start="url(#arS)" marker-end="url(#arS)"/>
    <line x1="227" y1="394" x2="227" y2="406"/>
  </g>
  <text x="250" y="404" font-size="12" font-weight="bold" fill="#1a6fb5">2–4 cm (tasma od sciany)</text>

  <!-- 4-5 cm: blenda glebokosc -->
  <g stroke="#c0392b" stroke-width="1.3">
    <line x1="300" y1="316" x2="300" y2="372" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <text x="294" y="350" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">4–5 cm</text>

  <!-- opuszczenie 20 cm (prawa strona) -->
  <g stroke="#444" stroke-width="1.1">
    <line x1="845" y1="96" x2="845" y2="316"/>
    <line x1="839" y1="96" x2="851" y2="96"/><line x1="839" y1="316" x2="851" y2="316"/>
  </g>
  <text x="862" y="210" font-size="12.5" font-weight="bold" fill="#444" transform="rotate(90 862 210)">opuszczenie 20 cm</text>

  <!-- welna wymiar -->
  <g stroke="#9a7b1f" stroke-width="1">
    <line x1="815" y1="96" x2="815" y2="216"/>
    <line x1="809" y1="96" x2="821" y2="96"/><line x1="809" y1="216" x2="821" y2="216"/>
  </g>
  <text x="805" y="156" font-size="11" fill="#9a7b1f" transform="rotate(90 805 156)">15 cm</text>

  <!-- kieszen swiatla label -->
  <text x="265" y="305" font-size="10.5" fill="#bb9020" text-anchor="middle">kieszen</text>

  <!-- ====== TABELA WYMIAROW ====== -->
  <g transform="translate(150,600)">
    <rect x="0" y="0" width="600" height="66" fill="#fbf7ec" stroke="#caa84a"/>
    <text x="14" y="22" font-size="13.5" font-weight="bold" fill="#7a5c10">WYMIARY DO ODMIERZENIA:</text>
    <text x="14" y="44" font-size="13" fill="#1a1a1a">• plyta od sciany: <tspan font-weight="bold">10 cm</tspan>   • tasma od sciany: <tspan font-weight="bold">3–4 cm</tspan>   • blenda w dol: <tspan font-weight="bold">4–5 cm</tspan></text>
    <text x="14" y="60" font-size="11.5" fill="#c0392b">tasma na profilu ALU • wnetrze kieszeni malowane na bialo matowo • zasilacz w rewizji</text>
  </g>
</svg>
